name: Build FxMultiHost 7-Path

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout FxMultiHost
        uses: actions/checkout@v4

      - name: Checkout official FxSound source
        uses: actions/checkout@v4
        with:
          repository: fxsound2/fxsound-app
          path: fxsound-app
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build AudioPassthru
        shell: cmd
        run: >
          msbuild fxsound-app\audiopassthru\audiopassthru.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /m

      - name: Build FxSound DSP
        shell: cmd
        run: >
          msbuild fxsound-app\dsp\DfxDsp.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /m

      - name: Install Windows Driver Kit
        shell: powershell
        run: |
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196230"
          $installer = "$env:RUNNER_TEMP\wdksetup.exe"

          Invoke-WebRequest -Uri $wdkUrl -OutFile $installer

          Start-Process -FilePath $installer `
            -ArgumentList "/quiet /norestart" `
            -Wait `
            -PassThru

          Write-Host "Checking WDK installation..."

          $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"

          if (-not (Test-Path "$wdkRoot\Include")) {
              Write-Error "Windows Driver Kit installation was not detected."
              exit 1
          }

          Get-ChildItem "$wdkRoot\Include" -Directory |
            Select-Object Name

          Write-Host "WDK installation detected."

      - name: Build FxVAD driver
        shell: cmd
        run: >
          msbuild fxsound-driver\fxvad\fxvad.sln
          /p:Configuration=Release
          /p:Platform=x64
          /m
      
      - name: Build FxVAD driver
        shell: cmd
        run: >
          msbuild fxsound-driver\fxvad\fxvad.sln
          /p:Configuration=Release
          /p:Platform=x64
          /m

      - name: Prepare driver package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\fxvad
          Copy-Item "fxsound-driver\fxvad\pcmex\fxvad.inf" "package\fxvad\fxvad.inf"
          Get-ChildItem "fxsound-driver\fxvad" -Recurse -Filter "fxvad.sys" |
            Select-Object -First 1 |
            Copy-Item -Destination "package\fxvad\fxvad.sys"
          Get-ChildItem "fxsound-driver\fxvad" -Recurse -Filter "*.cat" |
            Copy-Item -Destination "package\fxvad\" -Force
      
      - name: Build FxMultiHost
        shell: cmd
        run: >
          msbuild app\FxMultiHost7.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /m

      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "app\bin\FxMultiHost7.exe" "package\FxMultiHost7.exe"
          Copy-Item "README.md" "package\README.md"
          Copy-Item "LICENSE.txt" "package\LICENSE.txt"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FxMultiHost7-Windows-x64
          path: package
